<!-- sempre presente: anuncia "3 selecionados" a cada mudança (uma região que aparece junto com o texto não seria lida) -->
<span class="bulk-bar__count" aria-live="polite">{{ countText() }}</span>
<!-- sem seleção: invisível mas ocupando o espaço (a altura não muda); visibility também tira do foco e do leitor -->
<div class="bulk-bar__more">
  <button type="button" class="bulk-bar__clear" (click)="clear.emit()">{{ clearLabel() }}</button>
  @if (tpl(); as t) {
    <ng-container [ngTemplateOutlet]="t" [ngTemplateOutletContext]="ctx()" />
  } @else {
    @for (a of actions(); track a.type) {
      <!-- aria-disabled (e não disabled): continua focável, com o motivo na dica -->
      <button type="button" class="bulk-btn"
        [class.bulk-btn--danger]="a.danger"
        [attr.aria-disabled]="isDisabled(a) ? 'true' : null"
        [appTooltip]="reason(a)"
        (click)="onClick($event, a)">
        {{ a.label }}
      </button>
    }
  }
</div>
