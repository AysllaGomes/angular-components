<!-- Backdrop -->
@if (opened()) {
  <div
    class="ab"
    (click)="onBackdropClick($event)">
    <!-- Sheet: <div> e não <aside>, que não aceita role="dialog" (ARIA in HTML) -->
    <div
      #sheet
      class="ab__sheet"
      [class.ab--sm]="currentSize()==='sm'"
      [class.ab--md]="currentSize()==='md'"
      [class.ab--lg]="currentSize()==='lg'"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="labelId">
      <header class="ab__hdr">
        <h3 class="ab__title" [id]="labelId">{{ title() }}</h3>
        <button #closeBtn type="button" class="ab__close" (click)="close()" [attr.aria-label]="labels().close">×</button>
      </header>
      <div #content class="ab__content">
        <ng-content></ng-content>
      </div>
      <footer class="ab__ftr">
        <!-- Slot de ações customizadas -->
        <ng-content select="[abActions]"></ng-content>
        <!-- Ou botões padrão, se labels vierem -->
        @if (primaryLabel() || secondaryLabel()) {
          <div class="ab__auto-actions">
            @if (secondaryLabel(); as label) {
              <button
                appButton="ghost"
                size="md"
                type="button"
                class="btn btn--ghost"
                (click)="secondary.emit()"
                >
                {{ label }}
              </button>
            }
            @if (primaryLabel(); as label) {
              <button
                appButton="solid"
                tone="accent"
                size="md"
                type="button"
                class="btn"
                (click)="primary.emit()"
                >
                {{ label }}
              </button>
            }
          </div>
        }
      </footer>
    </div>
  </div>
}
