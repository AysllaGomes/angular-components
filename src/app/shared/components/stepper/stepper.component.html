<!--
  Navegação com lista ordenada de etapas: a atual leva aria-current="step" e as
  concluídas ganham um texto (só para leitor de tela). Não é role="tablist":
  etapas não são abas (não há painéis ligados a elas).
-->
<nav class="stepper" [attr.aria-label]="ariaLabel()">
  <ol class="stepper-list">
    @for (step of steps(); track $index; let i = $index) {
      <li
        class="stepper-item"
        [class.is-active]="getState(i) === 'active'"
        [class.is-done]="getState(i) === 'done'"
        [class.is-disabled]="getState(i) === 'disabled'"
        >
        <button
          class="stepper-button"
          type="button"
          [attr.aria-current]="getState(i) === 'active' ? 'step' : null"
          [disabled]="!canClick(i)"
          (click)="onStepClick(i)"
          >
          <span class="bullet" aria-hidden="true">
            @if (getState(i) === 'done') {
              <span class="check">✓</span>
            }
            @if (showIndex() && getState(i) !== 'done') {
              <span class="index">{{ i + 1 }}</span>
            }
          </span>
          <span class="texts">
            <span class="label">{{ step.label }}</span>
            @if (showCaption() && step.caption) {
              <span class="caption">{{ step.caption }}</span>
            }
            @if (getState(i) === 'done') {
              <span class="sr-only">({{ doneLabel() }})</span>
            }
          </span>
        </button>
        @if (i < steps().length - 1) {
          <span class="connector" aria-hidden="true"></span>
        }
      </li>
    }
  </ol>
</nav>
