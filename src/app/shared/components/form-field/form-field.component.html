<div class="ff" [class.is-error]="!!error()">
  <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -- o controle é projetado (ng-content); o `for` é ligado em runtime ao id dele -->
  <label class="ff__label">
    <span>{{ label() }}</span>
    @if (required()) {
      <span class="ff__req">{{ requiredLabel() }}</span>
    }
  </label>

  <div class="ff__control">
    <ng-content />
  </div>

  @if (error()) {
    <div class="ff__msg ff__msg--error" [id]="errorId">{{ error() }}</div>
  } @else if (hint()) {
    <div class="ff__msg" [id]="hintId">{{ hint() }}</div>
  }
</div>
