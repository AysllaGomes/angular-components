<nav
  class="pg"
  [class.pg--compact]="compact() === true"
  [class.pg--auto]="compact() === 'auto'"
  aria-label="Pagination"
  (keydown)="onKeydown($event)">
  @if (showFirstLast()) {
    <button
      appButton="ghost"
      size="sm"
      type="button"
      (click)="first()"
      [disabled]="!canPrev"
      aria-label="{{ 'pagination.first' | t }}">
      «
    </button>
  }

  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="prev()"
    [disabled]="!canPrev"
    aria-label="{{ 'pagination.prev' | t }}">
    ‹
  </button>

  <!-- modo compacto: texto no lugar dos números (escondido por CSS fora dele) -->
  <span class="pg-status" aria-live="polite">
    {{ 'pagination.status' | t:{ page: current + 1, total: pageCount } }}
  </span>

  <div class="pg-pages" role="list">
    @for (p of pages(); track p) {
      <button
        type="button"
        class="pg-btn"
        [class.is-active]="p === current"
        [attr.aria-current]="p === current ? 'page' : null"
        (click)="goTo(p)">
        {{ p + 1 }}
      </button>
    }
  </div>

  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="next()"
    [disabled]="!canNext"
    aria-label="{{ 'pagination.next' | t }}">
    ›
  </button>

  @if (showFirstLast()) {
    <button
      appButton="ghost"
      size="sm"
      type="button"
      (click)="last()"
      [disabled]="!canNext"
      aria-label="{{ 'pagination.last' | t }}">
      »
    </button>
  }
</nav>
