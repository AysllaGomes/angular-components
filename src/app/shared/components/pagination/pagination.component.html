<nav
  class="pg"
  [class.pg--compact]="compact() === true"
  [class.pg--auto]="compact() === 'auto'"
  [attr.aria-label]="ariaLabel() || labels().pagination.nav"
  (keydown)="onKeydown($event)">
  @if (showFirstLast()) {
    <button
      appButton="ghost"
      size="sm"
      type="button"
      (click)="first()"
      [disabled]="!canPrev"
      [attr.aria-label]="labels().pagination.first">
      «
    </button>
  }

  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="prev()"
    [disabled]="!canPrev"
    [attr.aria-label]="labels().pagination.prev">
    ‹
  </button>

  <!-- modo compacto: texto no lugar dos números (escondido por CSS fora dele) -->
  <span class="pg-status" aria-live="polite">
    {{ labels().pagination.status(current + 1, pageCount) }}
  </span>

  <div class="pg-pages">
    @for (p of pages(); track p) {
      <button
        type="button"
        class="pg-btn"
        [class.is-active]="p === current"
        [attr.aria-current]="p === current ? 'page' : null"
        (click)="goTo(p)">
        {{ p + 1 }}
      </button>
    }
  </div>

  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="next()"
    [disabled]="!canNext"
    [attr.aria-label]="labels().pagination.next">
    ›
  </button>

  @if (showFirstLast()) {
    <button
      appButton="ghost"
      size="sm"
      type="button"
      (click)="last()"
      [disabled]="!canNext"
      [attr.aria-label]="labels().pagination.last">
      »
    </button>
  }
</nav>
