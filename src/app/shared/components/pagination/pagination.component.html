<nav class="pg" aria-label="Pagination">
  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="prev()"
    [disabled]="!canPrev"
    aria-label="{{ 'pagination.prev' | t }}">
    ‹
  </button>

  <div class="pg-pages" role="list">
    @for (p of pages(); track p) {
      <button
        type="button"
        class="pg-btn"
        [class.is-active]="p === current"
        [attr.aria-current]="p === current ? 'page' : null"
        (click)="goTo(p)">
        {{ p + 1 }}
      </button>
    }
  </div>

  <button
    appButton="ghost"
    size="sm"
    type="button"
    (click)="next()"
    [disabled]="!canNext"
    aria-label="{{ 'pagination.next' | t }}">
    ›
  </button>
</nav>
