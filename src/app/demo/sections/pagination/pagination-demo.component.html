<section id="pagination" class="demo-section">
  <h2>{{ 'section.pagination.title' | t }}</h2>
  <p class="lead">{{ 'section.pagination.lead' | t }}</p>

  <article class="card">
    <div class="row">
      <div class="muted">{{ 'pagination.range' | t:{ start: start(), end: end(), total: total() } }}</div>

      <label class="page-size">
        {{ 'pagination.itemsPerPage' | t }}
        <select [value]="pageSize()" (change)="onPageSizeChange(+$any($event.target).value)">
          <option [value]="5">5</option>
          <option [value]="10">10</option>
          <option [value]="20">20</option>
        </select>
      </label>
    </div>

    <div class="pager-wrap">
      @if (total() > pageSize()) {
        <app-pagination
          [total]="total()"
          [pageSize]="pageSize()"
          [pageIndex]="pageIndex()"
          [maxVisible]="5"
          compact="auto"
          showFirstLast
          (pageChange)="pageIndex.set($event)">
        </app-pagination>
      }
    </div>
  </article>

  <article class="card">
    <h3>{{ 'pagination.demo.compact.title' | t }}</h3>
    <div class="pager-wrap">
      <app-pagination
        [total]="total()"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        compact
        showFirstLast
        (pageChange)="pageIndex.set($event)">
      </app-pagination>
    </div>
    <small class="muted">{{ 'pagination.demo.compact.note' | t }}</small>
  </article>
</section>
