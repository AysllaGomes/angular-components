<section id="table" class="demo-section">
  <h2>{{ 'section.table.title' | t }}</h2>
  <p class="lead">{{ 'section.table.lead' | t }}</p>

  <article class="card">
    <div class="toolbar">
      <button class="pill" type="button"
        (click)="simulateLoad()"
        [disabled]="loading()">
        {{ loading() ? ('table.toolbar.simulate.loading' | t)
        : ('table.toolbar.simulate' | t) }}
      </button>

      <button class="pill" type="button" (click)="simulateError()" [disabled]="loading()">
        {{ 'table.toolbar.simulateError' | t }}
      </button>

      <button class="pill" type="button" (click)="toggleEmpty()">
        {{ empty()
        ? ('table.toolbar.toggleEmpty.hide' | t)
        : ('table.toolbar.toggleEmpty.show' | t) }}
      </button>

      @if (removedCount() > 0) {
        <button class="pill" type="button" (click)="restoreRows()">
          {{ 'table.toolbar.restore' | t:{ n: removedCount() } }}
        </button>
      }
    </div>

    <div class="tbl-wrap">
      <app-table
        [columns]="columns"
        [data]="pagedRows()"
        [loading]="loading()"
        [loadingRows]="pageSize"
        [emptyMessage]="'table.empty' | t"
        [error]="errorKey() ? ('table.error.load' | t) : null"
        [retryLabel]="'table.retry' | t"
        (retry)="retryLoad()"
        [selectable]="true"
        [selectColWidth]="20"
        [actions]="actions()"
        [actionsColWidth]="'80px'"
        [actionsLabel]="'table.actions' | t"
        [showActions]="true"
        rowKey="documento"
        [selected]="selected()"
        [sortKey]="sort()?.key || undefined"
        [sortDir]="sort()?.dir || 'asc'"
        (sortChange)="onSort($event)"
        (selectedChange)="selected.set($event)"
        [bulkActions]="bulkActions()"
        [bulkActionsLabel]="'table.bulk.label' | t"
        [selectedCountLabel]="countLabel"
        [clearSelectionLabel]="'table.bulk.clear' | t"
        (bulkAction)="onBulk($any($event))"
        (action)="onAction($event)">
      </app-table>
    </div>

    <!-- com erro não há páginas para navegar -->
    @if (rows().length > pageSize && !errorKey()) {
      <div class="tbl-footer">
        <span class="total">{{ 'table.total' | t:{ n: rows().length } }}</span>
        <app-pagination
          [ariaLabel]="'pagination.nav.table' | t"
          [total]="rows().length"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex()"
          (pageChange)="pageIndex.set($event)">
        </app-pagination>
      </div>
    }
  </article>
</section>
