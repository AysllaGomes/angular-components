<a class="skip-link" href="demo#main" data-target="main">Pular para o conteúdo</a>

<header class="demo-header">
  <div class="container hdr">
    <!-- Botão do menu (só aparece no mobile via CSS) -->
    <button
      class="icon-pill menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="openNav()"
      [attr.aria-controls]="'demoNav'"
      [title]="'header.menu' | t"
      [attr.aria-label]="'header.menu' | t">
      <!-- ícone hambúrguer / fechar -->
      @if (!openNav()) {
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="currentColor"/>
        </svg>
      }
      @if (openNav()) {
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3 10.6 10.6 16.9 4.3z" fill="currentColor"/>
        </svg>
      }
    </button>

    <!-- a marca leva à apresentação (home) -->
    <a class="brand" routerLink="/">{{ 'brand' | t }}</a>

    <nav
      id="demoNav"
      class="nav"
      [class.is-open]="openNav()"
      [attr.aria-label]="'header.nav' | t"
      (click)="onNavClick($event)">
      <!--
        "Componentes" no padrão "disclosure navigation" (WAI-ARIA): um botão com
        aria-expanded mostra/esconde o painel com os grupos, e cada item leva à página
        do componente. No menu compacto (☰) o botão some e os grupos aparecem abertos.
      -->
      <div class="group" [class.is-open]="openGroup() === 'components'" (focusout)="onGroupFocusOut($event, 'components')">
        <button
          type="button"
          class="group-btn"
          [class.is-active]="inComponents()"
          [attr.aria-expanded]="openGroup() === 'components'"
          aria-controls="nav-components"
          (click)="toggleGroup('components')">
          {{ 'cp.components' | t }}<span class="chev" aria-hidden="true">▾</span>
        </button>
        <span class="group-title" aria-hidden="true">{{ 'cp.components' | t }}</span>
        <div class="sub mega" id="nav-components">
          @for (g of groups(); track g.id) {
            <div>
              <p class="mega__title" [id]="'navg-' + g.id">{{ g.label }}</p>
              <ul [attr.aria-labelledby]="'navg-' + g.id">
                @for (c of g.items; track c.id) {
                  <li>
                    <a [routerLink]="['/componentes', c.id]" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ c.name }}</a>
                  </li>
                }
              </ul>
            </div>
          }
        </div>
      </div>

      <a class="nav-link" routerLink="/demo" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ 'header.demo' | t }}</a>
      <a class="nav-link" routerLink="/acessibilidade" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ 'cp.a11y' | t }}</a>

      <!-- celular estreito (< 480px): as cores não cabem na barra e ficam aqui, maiores -->
      <div class="menu-accent">
        <span class="group-title" aria-hidden="true">{{ 'header.accent' | t }}</span>
        <ng-container [ngTemplateOutlet]="accentPicker" [ngTemplateOutletContext]="{ $implicit: 'menu' }" />
      </div>
    </nav>

    <div class="actions">
      <!-- Trocar idioma -->
      <button
        class="icon-pill"
        type="button"
        (click)="toggleLang()"
        [attr.title]="i18n.lang() === 'pt' ? ('header.lang.tooltip'|t) : ('header.lang.tooltip'|t)"
        [attr.aria-label]="i18n.lang() === 'pt' ? ('header.lang.tooltip'|t) : ('header.lang.tooltip'|t)">
        <img [src]="i18n.lang()==='pt' ? 'icons/flags/br.svg' : 'icons/flags/us.svg'" width="18" height="18" alt="">
        <span class="sr-only">{{ i18n.lang() === 'pt' ? ('header.lang.tooltip'|t) : ('header.lang.tooltip'|t) }}</span>
      </button>

      <!-- Trocar tema -->
      <button
        class="icon-pill"
        type="button"
        (click)="toggleTheme()"
        [attr.title]="theme.theme() === 'light' ? ('button.theme.light'|t) : ('button.theme.dark'|t)"
        [attr.aria-label]="theme.theme() === 'light' ? ('button.theme.light'|t) : ('button.theme.dark'|t)"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        >
        @if (theme.theme() === 'light') {
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zM1 13h3v-2H1v2zm10-9h-2v3h2V4zm7.04.46l-1.41-1.41-1.8 1.79 1.41 1.41 1.8-1.79zM20 11v2h3v-2h-3zm-9 9h2v-3h-2v3zm6.24-1.84l1.8 1.79 1.41-1.41-1.79-1.8-1.42 1.42zM4.22 17.66l1.8-1.79-1.42-1.42-1.79 1.8 1.41 1.41zM12 8a4 4 0 100 8 4 4 0 000-8z" fill="currentColor"/>
          </svg>
        }
        @if (theme.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a9.99 9.99 0 00-8.94 5.5A10 10 0 0012 22a9.99 9.99 0 008.94-5.5A10 10 0 0112 2zm0 18a8 8 0 01-6.93-12A9 9 0 0012 20z" fill="currentColor"/>
          </svg>
        }
        <span class="sr-only">
          {{ theme.theme() === 'light' ? ('button.theme.light'|t) : ('button.theme.dark'|t) }}
        </span>
      </button>

      <!-- cores de destaque na barra (no celular estreito elas vão para o menu ☰) -->
      <ng-container [ngTemplateOutlet]="accentPicker" [ngTemplateOutletContext]="{ $implicit: 'bar' }" />
    </div>
  </div>
</header>

<!-- as 5 cores, usadas na barra e no menu; só uma das duas cópias aparece (CSS) -->
<ng-template #accentPicker let-place>
  <div class="accent-picker accent-picker--{{ place }}" role="group" [attr.aria-label]="'header.accent' | t">
    @for (a of accents; track a) {
      <button
        type="button"
        class="swatch swatch--{{ a }}"
        [class.is-active]="theme.accent() === a"
        [attr.aria-pressed]="theme.accent() === a"
        (click)="setAccent(a)"
        [title]="'accent.' + a | t"
        [attr.aria-label]="'accent.' + a | t">
      </button>
    }
  </div>
</ng-template>
