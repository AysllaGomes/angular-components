<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Angular Components</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Componentes Angular standalone, acessíveis e sem frameworks de UI: ActionBar, Button, Dialog, Pagination, Select, Stepper, Table e Toast.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    Aplica tema, cor de destaque e idioma salvos ANTES da primeira pintura,
    evitando a "piscada" do tema claro com SSR. Mesmas chaves e valores
    aceitos pelo ThemeService e pelo I18nService.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      function pick(key, allowed) {
        try { var v = localStorage.getItem(key); return allowed.indexOf(v) >= 0 ? v : null; }
        catch (e) { return null; }
      }
      var theme  = pick('demo-theme',  ['light', 'dark']);
      var accent = pick('demo-accent', ['teal', 'orange', 'violet', 'blue', 'rose']);
      var lang   = pick('demo-lang',   ['pt', 'en']);
      if (theme)  root.setAttribute('data-theme', theme);
      if (accent) root.setAttribute('data-accent', accent);
      if (lang)   root.lang = lang === 'en' ? 'en' : 'pt-BR';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
