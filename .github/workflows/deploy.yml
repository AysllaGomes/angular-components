# .github/workflows/deploy.yml
name: deploy-gh-pages
# título na lista do Actions (o padrão repetia a mensagem do commit em todos os workflows)
run-name: "Deploy do site · ${{ github.event.head_commit.message }}"
on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

# build e deploy em jobs separados: no mesmo job, o deploy-pages às vezes procura o artefato
# logo depois do upload e não acha ("No artifacts named github-pages"); ver actions/deploy-pages#451
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # testes antes do build: se falharem, nada é publicado
      - run: npm run test:ci

      # use o script do package.json (já com --base-href /angular-components/)
      - run: npm run build

      # normaliza a saída SSR (index.csr.html -> index.html) e cria o fallback 404.html
      - name: Normalize SSR index and create 404 fallback
        run: |
          B=dist/angular-components/browser
          if [ ! -f "$B/index.html" ] && [ -f "$B/index.csr.html" ]; then
            cp "$B/index.csr.html" "$B/index.html"
          fi
          cp "$B/index.html" "$B/404.html"

      - name: Make root redirect to /<repo>/demo/
        run: |
          B=dist/angular-components/browser
          REPO=${{ github.event.repository.name }}
          cat > "$B/index.html" <<EOF
          <!doctype html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/$REPO/demo/">
          <script>location.replace('/$REPO/demo/');</script>
          <title>Redirecting…</title>
          <p>Redirecting to <a href="/$REPO/demo/">/$REPO/demo/</a></p>
          EOF
          cp "$B/index.html" "$B/404.html"

      - uses: actions/configure-pages@v6
        with:
          enablement: enabled

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/angular-components/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
