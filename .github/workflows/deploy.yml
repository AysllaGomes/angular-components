# .github/workflows/deploy.yml
name: deploy-gh-pages
# título na lista do Actions (o padrão repetia a mensagem do commit em todos os workflows)
run-name: "Deploy do site · ${{ github.event.head_commit.message }}"
on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

# build e deploy em jobs separados: no mesmo job, o deploy-pages às vezes procura o artefato
# logo depois do upload e não acha ("No artifacts named github-pages"); ver actions/deploy-pages#451
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # componentes funcionam fora deste projeto: toda var(--x) com valor padrão
      - run: npm run check:css
      # "O que copiar" de cada documento bate com os imports de verdade
      - run: npm run check:copy
      # páginas de componente geradas dos .md, em dia com eles
      - run: npm run check:pages

      # testes antes do build: se falharem, nada é publicado
      - run: npm run test:ci

      # use o script do package.json (já com --base-href /angular-components/)
      - run: npm run build

      # a raiz é a home pré-renderizada (index.html) e /demo/ a demo (demo/index.html).
      # 404.html = a casca sem conteúdo pré-renderizado (index.csr.html): num endereço
      # desconhecido o roteador decide o que mostrar, sem conflito com a hidratação.
      - name: Check prerendered pages and create 404 fallback
        run: |
          B=dist/angular-components/browser
          test -f "$B/index.html" || { echo "::error::home (index.html) não foi pré-renderizada"; exit 1; }
          test -f "$B/demo/index.html" || { echo "::error::demo (demo/index.html) não foi pré-renderizada"; exit 1; }
          test -f "$B/acessibilidade/index.html" || { echo "::error::/acessibilidade não foi pré-renderizada"; exit 1; }
          n=$(ls -d "$B"/componentes/*/ 2>/dev/null | wc -l)
          [ "$n" -ge 15 ] || { echo "::error::só $n páginas de componente pré-renderizadas (esperado: 15)"; exit 1; }
          if [ -f "$B/index.csr.html" ]; then cp "$B/index.csr.html" "$B/404.html"; else cp "$B/index.html" "$B/404.html"; fi

      - uses: actions/configure-pages@v6
        with:
          enablement: enabled

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/angular-components/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
