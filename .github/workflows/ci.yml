# .github/workflows/ci.yml
# Valida PRs e branches de trabalho. Pushes na main são testados pelo
# deploy.yml (testes → build → publicação), evitando runs duplicados.
name: ci
run-name: "CI · ${{ github.head_ref || github.ref_name }}"
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
