# .github/workflows/ci.yml
# Valida PRs e branches de trabalho. Pushes na main são testados pelo
# deploy.yml (testes → build → publicação), evitando runs duplicados.
name: ci
run-name: "CI · ${{ github.head_ref || github.ref_name }}"
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # componentes funcionam fora deste projeto: toda var(--x) com valor padrão
      - run: npm run check:css
      # "O que copiar" de cada documento bate com os imports de verdade
      - run: npm run check:copy
      # e basta: só o que ela lista, numa pasta vazia, compila (TypeScript estrito)
      - run: npm run check:copy-compile
      # todo input/model/output público aparece no doc, em PT e em EN
      - run: npm run check:api
      # páginas de componente geradas dos .md, em dia com eles
      - run: npm run check:pages
      - run: npm run test:ci
      - run: npm run build
      # links do site publicado resolvem a partir do base href (/angular-components/)
      - run: npm run check:links
      # fluxos principais num navegador de verdade, no site servido como o GitHub Pages
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
