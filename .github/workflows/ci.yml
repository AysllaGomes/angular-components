# .github/workflows/ci.yml
# Valida PRs e branches de trabalho. Pushes na main são testados pelo
# deploy.yml (testes → build → publicação), evitando runs duplicados.
name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
